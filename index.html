<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b35">
<title>De clinic</title>
<style>
:root{--green:#123b35;--mint:#e8f2ef;--gold:#c7a66a;--ink:#20302d;--muted:#6c7c78;--bg:#f5f7f6;--white:#fff;--line:#e2e9e6}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:white;padding:20px 18px 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0c292522}
.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border:1px solid #ffffff70;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#e8d3a9}
h1{font-size:22px;margin:0;letter-spacing:.2px}.sub{font-size:12px;color:#d4e2dd;margin-top:4px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:white;border-bottom:1px solid var(--line);position:sticky;top:81px;z-index:4}
nav button{border:1px solid var(--line);background:white;color:var(--green);padding:10px 13px;border-radius:11px;white-space:nowrap;font-size:13px;font-weight:600}
nav button.active{background:var(--green);color:white;border-color:var(--green)}
main{max-width:1000px;margin:0 auto;padding:18px 14px 40px}.page-title{font-size:22px;margin:6px 0 4px}.hint{color:var(--muted);font-size:13px;margin:0 0 17px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 3px 10px #142b2410}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:9px;color:var(--green)}
.panel{margin-top:14px}.panel h3{margin:0 0 12px;font-size:16px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfcfc;color:var(--green);font-weight:600;text-align:right}
form{display:grid;gap:12px}.field{display:grid;gap:6px}label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e2de;border-radius:11px;font:inherit;font-size:15px;background:white;color:var(--ink)}.primary{border:0;background:var(--green);color:white;padding:13px 16px;border-radius:12px;font:inherit;font-weight:700}.secondary{border:1px solid var(--line);background:white;color:var(--green);padding:10px 12px;border-radius:10px;font:inherit}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}.notice{background:#fff8e8;border:1px solid #ead8ad;color:#6f5625;border-radius:12px;padding:12px;font-size:12px;line-height:1.7;margin-top:15px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
@media(min-width:700px){header{padding-left:max(24px,calc((100vw - 1000px)/2));padding-right:max(24px,calc((100vw - 1000px)/2))}nav{justify-content:center;top:81px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.actions{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding-top:26px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">✚</div><div><h1>De clinic</h1><div class="sub">نظام إدارة عيادة الأسنان</div></div></div></header>
<nav id="nav">
<button class="active" data-page="home">الرئيسية</button><button data-page="patients">المرضى</button><button data-page="payments">التحصيلات</button><button data-page="expenses">المصروفات</button><button data-page="doctors">الأطباء</button><button data-page="dues">مستحقات الأطباء</button><button data-page="reports">التقارير</button>
</nav>
<main id="app"></main><footer>De clinic · نسخة تجريبية أولية</footer>
<script>
const KEY='declinic_demo_v1';
const initial={patients:[],payments:[],expenses:[],doctors:[],dues:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=JSON.parse(JSON.stringify(initial))}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const money=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ج.م';
const app=document.getElementById('app');let current='home';
function setPage(p){current=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function panel(title,body){return `<section class="panel"><h3>${title}</h3>${body}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="empty">لا توجد بيانات مسجلة بعد</td></tr>`}</tbody></table></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function form(fields,button,action){return `<form id="dataform">${fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==='select'?`<select name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`:`<input name="${f.name}" type="${f.type||'text'}" placeholder="${f.placeholder||''}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''}>`}</div>`).join('')}<button class="primary" type="submit">${button}</button></form>`}
function bind(collection,fields){let f=document.getElementById('dataform');if(!f)return;f.onsubmit=e=>{e.preventDefault();let item=Object.fromEntries(new FormData(f).entries());item.id=Date.now().toString();if(item.amount!==undefined)item.amount=Number(item.amount)||0;if(item.cost!==undefined)item.cost=Number(item.cost)||0;if(item.rate!==undefined)item.rate=Number(item.rate)||0;db[collection].push(item);save();render()}}
function render(){
let total=db.payments.reduce((s,x)=>s+x.amount,0),expenses=db.expenses.reduce((s,x)=>s+x.amount,0);
let titles={home:['الرئيسية','ملخص سريع لحركة العيادة'],patients:['المرضى','إضافة المرضى ومراجعة سجلهم'],payments:['التحصيلات','سجل المبالغ التي تم تحصيلها فعليًا'],expenses:['المصروفات','تسجيل المصروفات المدفوعة'],doctors:['الأطباء','إعداد نظام أجر كل طبيب'],dues:['مستحقات الأطباء','تقدير المستحقات بناءً على التحصيل بعد خصم التكلفة المحددة'],reports:['التقارير','ملخص البيانات المسجلة على هذا الجهاز']};
let [title,sub]=titles[current];let out=`<h2 class="page-title">${title}</h2><p class="hint">${sub}</p>`;
if(current==='home')out+=`<div class="stats"><div class="stat"><span>عدد المرضى</span><strong>${db.patients.length}</strong></div><div class="stat"><span>إجمالي التحصيلات</span><strong>${money(total)}</strong></div><div class="stat"><span>المصروفات المسجلة</span><strong>${money(expenses)}</strong></div><div class="stat"><span>صافي حركة النقدية التقريبي</span><strong>${money(total-expenses)}</strong></div></div>`+panel('الوصول السريع',`<div class="actions"><button class="action" onclick="setPage('patients')">＋ إضافة مريض</button><button class="action" onclick="setPage('payments')">＋ تسجيل تحصيل</button><button class="action" onclick="setPage('expenses')">＋ تسجيل مصروف</button><button class="action" onclick="setPage('doctors')">إعداد الأطباء</button></div>`);
if(current==='patients')out+=panel('إضافة مريض',form([{name:'name',label:'اسم المريض',required:true},{name:'phone',label:'رقم الهاتف',type:'tel'},{name:'notes',label:'ملاحظات'}],'حفظ بيانات المريض'))+panel('قائمة المرضى',table(['الاسم','الهاتف','ملاحظات'],db.patients.map(x=>[x.name,x.phone,x.notes])));
if(current==='payments')out+=panel('تسجيل تحصيل',form([{name:'patient',label:'اسم المريض',required:true},{name:'doctor',label:'الطبيب'},{name:'procedure',label:'الإجراء العلاجي'},{name:'amount',label:'المبلغ المحصل (ج.م)',type:'number',min:0,step:'0.01',required:true},{name:'date',label:'التاريخ',type:'date'}],'حفظ التحصيل'))+panel('سجل التحصيلات',table(['المريض','الطبيب','الإجراء','المبلغ','التاريخ'],db.payments.map(x=>[x.patient,x.doctor,x.procedure,money(x.amount),x.date])));
if(current==='expenses')out+=panel('تسجيل مصروف',form([{name:'title',label:'بيان المصروف',required:true},{name:'category',label:'التصنيف',type:'select',options:['معمل','خامات','إيجار','مرتبات','صيانة','أخرى']},{name:'amount',label:'المبلغ (ج.م)',type:'number',min:0,step:'0.01',required:true},{name:'date',label:'التاريخ',type:'date'}],'حفظ المصروف'))+panel('سجل المصروفات',table(['البيان','التصنيف','المبلغ','التاريخ'],db.expenses.map(x=>[x.title,x.category,money(x.amount),x.date])));
if(current==='doctors')out+=panel('إضافة طبيب',form([{name:'name',label:'اسم الطبيب',required:true},{name:'scheme',label:'نظام الأجر',type:'select',options:['مرتب فقط','نسبة فقط','مرتب + نسبة']},{name:'salary',label:'المرتب الشهري (ج.م)',type:'number',min:0,step:'0.01'},{name:'rate',label:'النسبة %',type:'number',min:0,step:'0.1'},{name:'cost',label:'تكلفة ثابتة تخصم من أساس النسبة لكل تحصيل (ج.م)',type:'number',min:0,step:'0.01'}],'حفظ الطبيب'))+panel('قائمة الأطباء',table(['الطبيب','النظام','المرتب','النسبة','التكلفة لكل تحصيل'],db.doctors.map(x=>[x.name,x.scheme,money(x.salary),`${x.rate||0}%`,money(x.cost)])));
if(current==='dues'){let rows=db.doctors.map(d=>{let p=db.payments.filter(x=>x.doctor===d.name).reduce((s,x)=>s+x.amount,0),base=Math.max(0,p-(Number(d.cost)||0)*db.payments.filter(x=>x.doctor===d.name).length),comm=d.scheme==='مرتب فقط'?0:base*(Number(d.rate)||0)/100,sal=d.scheme==='نسبة فقط'?0:Number(d.salary)||0;return[d.name,money(p),money(base),money(comm),money(sal),money(comm+sal)]});out+=panel('حساب تقديري للمستحقات',`<p class="hint">أساس النسبة = مجموع التحصيلات المسجلة للطبيب − التكلفة المحددة لكل تحصيل. راجع الاتفاق الفعلي قبل الصرف.</p>`+table(['الطبيب','التحصيل','أساس النسبة','العمولة','المرتب','الإجمالي التقديري'],rows))}
if(current==='reports')out+=panel('ملخص الحسابات',table(['البند','القيمة'],[['عدد المرضى',db.patients.length],['عدد الأطباء',db.doctors.length],['إجمالي التحصيلات',money(total)],['إجمالي المصروفات',money(expenses)],['صافي حركة النقدية التقريبي',money(total-expenses)]]))+panel('نسخة احتياطية',`<button class="primary" id="export">تنزيل نسخة احتياطية للبيانات</button> <button class="secondary" id="clear">مسح بيانات هذا الجهاز</button>`);
out+=`<div class="notice">نسخة تجريبية: البيانات محفوظة في متصفح هذا الجهاز فقط، ولا تتم مزامنتها بين الأجهزة. لا تستخدم بيانات مرضى حقيقية قبل إضافة تسجيل دخول آمن، وقاعدة بيانات مشتركة، ونسخ احتياطي. حساب المستحقات هنا تقديري وليس دفترًا محاسبيًا نهائيًا.</div>`;app.innerHTML=out;
if(['patients','payments','expenses','doctors'].includes(current))bind(({patients:'patients',payments:'payments',expenses:'expenses',doctors:'doctors'})[current]);
let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='de-clinic-backup.json';a.click();URL.revokeObjectURL(a.href)};
let cl=document.getElementById('clear');if(cl)cl.onclick=()=>{if(confirm('متأكد من مسح كل البيانات المحفوظة على هذا الجهاز؟')){db=JSON.parse(JSON.stringify(initial));save();render()}};
}
render();
</script>
</body></html>
